<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vela — agente di viaggio</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0e1414;
    --panel: #161f1f;
    --accent: #7fd9a8;
    --text: #eef2ef;
    --muted: #93a19c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px 40px;
  }
  main { width: 100%; max-width: 640px; }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 4px; }
  p.tagline { color: var(--muted); font-size: 0.9rem; margin: 0 0 28px; }
  .mic-stage {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 32px 16px; margin-bottom: 20px;
  }
  #mic {
    width: 96px; height: 96px; border-radius: 50%; border: none;
    background: var(--panel); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 2.2rem; cursor: pointer; transition: transform 0.15s, background 0.15s;
    box-shadow: 0 0 0 0 rgba(127,217,168,0.5);
  }
  #mic:active { transform: scale(0.96); }
  #mic.listening { background: var(--accent); color: #0e1414; animation: pulse 1.4s infinite; }
  #mic.speaking { background: #2a3a35; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(127,217,168,0.45); }
    70% { box-shadow: 0 0 0 18px rgba(127,217,168,0); }
    100% { box-shadow: 0 0 0 0 rgba(127,217,168,0); }
  }
  #status { color: var(--muted); font-size: 0.85rem; min-height: 1.2em; text-align: center; }
  #lastReply {
    font-size: 1.05rem; text-align: center; line-height: 1.5; min-height: 3em;
    max-width: 520px;
  }
  form { display: flex; gap: 8px; margin-bottom: 24px; }
  input[type=text] {
    flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #2a3733;
    background: var(--panel); color: var(--text); font-size: 0.95rem;
  }
  button.send { padding: 10px 16px; border-radius: 8px; border: none; background: var(--accent); color: #0e1414; font-weight: 600; cursor: pointer; }
  details { color: var(--muted); font-size: 0.85rem; }
  summary { cursor: pointer; margin-bottom: 8px; }
  .transcript { display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 8px 12px; border-radius: 8px; max-width: 85%; font-size: 0.88rem; }
  .msg.traveller { align-self: flex-end; background: #1f2e29; }
  .msg.agent { align-self: flex-start; background: var(--panel); }
  .hint { font-size: 0.78rem; color: var(--muted); margin-top: -18px; margin-bottom: 24px; }
</style>
</head>
<body>
<main>
  <h1>Vela</h1>
  <p class="tagline">Non un sito di prenotazione: parlagli come parleresti a un umano. Padel, tennis, hotel — un'unica richiesta, in una frase.</p>

  <div class="mic-stage">
    <button id="mic" aria-label="Parla con Vela">🎙️</button>
    <div id="status" aria-live="polite">Tocca il microfono e di' cosa vuoi</div>
    <div id="lastReply" aria-live="polite"></div>
  </div>

  <form id="textForm">
    <input id="textInput" type="text" placeholder="…oppure scrivi qui se non puoi parlare ad alta voce" autocomplete="off" />
    <button class="send" type="submit">Invia</button>
  </form>
  <p class="hint">Il testo è un ripiego per chi non può usare la voce — l'interazione pensata è vocale, a schermo spento.</p>

  <details>
    <summary>Trascrizione (per revisione)</summary>
    <div id="transcript" class="transcript"></div>
  </details>
</main>

<script>
(function () {
  const SESSION_KEY = "vela.session.v1";
  let sessionId = null;
  try { sessionId = localStorage.getItem(SESSION_KEY); } catch (e) {}

  const mic = document.getElementById("mic");
  const status = document.getElementById("status");
  const lastReply = document.getElementById("lastReply");
  const transcript = document.getElementById("transcript");
  const form = document.getElementById("textForm");
  const input = document.getElementById("textInput");

  function addMessage(role, text) {
    const el = document.createElement("div");
    el.className = "msg " + role;
    el.textContent = text;
    transcript.appendChild(el);
    transcript.scrollTop = transcript.scrollHeight;
  }

  function speak(text) {
    if (!("speechSynthesis" in window)) return;
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "it-IT";
    mic.classList.add("speaking");
    utter.onend = () => mic.classList.remove("speaking");
    speechSynthesis.cancel();
    speechSynthesis.speak(utter);
  }

  async function send(text) {
    if (!text || !text.trim()) return;
    addMessage("traveller", text);
    status.textContent = "…";
    try {
      const res = await fetch("/api/message", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ sessionId, text }),
      });
      const data = await res.json();
      if (data.sessionId) {
        sessionId = data.sessionId;
        try { localStorage.setItem(SESSION_KEY, sessionId); } catch (e) {}
      }
      lastReply.textContent = data.reply || "";
      addMessage("agent", data.reply || "");
      speak(data.reply || "");
      status.textContent = "Tocca il microfono per rispondere";
    } catch (err) {
      status.textContent = "Errore di rete, riprova.";
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value;
    input.value = "";
    send(text);
  });

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizing = false;
  let recognizer = null;

  if (SpeechRecognition) {
    recognizer = new SpeechRecognition();
    recognizer.lang = "it-IT";
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 1;

    recognizer.onstart = () => {
      recognizing = true;
      mic.classList.add("listening");
      status.textContent = "Ti ascolto…";
    };
    recognizer.onend = () => {
      recognizing = false;
      mic.classList.remove("listening");
    };
    recognizer.onerror = () => {
      recognizing = false;
      mic.classList.remove("listening");
      status.textContent = "Non ho sentito bene, riprova.";
    };
    recognizer.onresult = (event) => {
      const text = event.results[0][0].transcript;
      send(text);
    };

    mic.addEventListener("click", () => {
      if (recognizing) { recognizer.stop(); return; }
      if ("speechSynthesis" in window) speechSynthesis.cancel();
      try { recognizer.start(); } catch (e) { /* already starting, ignore */ }
    });
  } else {
    status.textContent = "Riconoscimento vocale non supportato qui — usa il campo di testo.";
    mic.disabled = true;
    mic.style.opacity = "0.4";
  }
})();
</script>
</body>
</html>
